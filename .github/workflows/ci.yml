name: CI

on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치에서 새 push가 들어오면 진행 중인 워크플로우 취소 (CI 큐 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vercel과 분리된 *코드 품질 게이트* 단계.
  # 빌드용 placeholder URL — 실제 백엔드와 통신하지 않으며 Zod URL 검증만 통과.
  # 프로젝트별로 GitHub Secrets에 BACKEND_API_BASE_URL을 등록하면 그 값이 우선.
  BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL || 'http://placeholder.local' }}

jobs:
  check:
    name: Check (typecheck + lint + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run check-all
        run: npm run check-all

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test
  # E2E (Playwright) job은 옵션 — baseline에 미포함.
  # 도입 시 docs/optional/e2e-playwright.md §보존 코드 4를 여기에 추가하고
  # Branch Protection의 required status checks에 등록하세요.
